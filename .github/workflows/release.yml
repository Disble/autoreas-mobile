name: Release

# A pushed v-tag is the only thing that publishes a release. Nothing here runs on
# a branch push: `main` carries deployments, and the tag is what names one.
on:
  push:
    tags:
      - 'v*'

# Least privilege by default: only the job that publishes gets write. Every action
# below is pinned to a commit SHA, not a tag -- a tag is mutable by whoever owns it,
# and the publish job holds EXPO_TOKEN and the write scope. Update deliberately; the
# trailing comment names the version each SHA was.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that can be known without building. This job exists so a bad tag
  # fails in about a minute instead of after a ~20-minute Gradle build. The native
  # gate (Kotlin unit tests + Android lint) used to run here too; it now runs as its
  # own `native` job in parallel with `build` (see that job, and C7 in
  # odd/tasks/build-resource-optimization.md) -- this job decides only WHETHER that
  # job needs to run at all, via the `native` output below.
  guard:
    name: Guard
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      native: ${{ steps.native-gate.outputs.decision }}
    steps:
      # fetch-depth: 0 fetches full history AND every tag (actions/checkout's own
      # description: "0 indicates all history for all branches and tags") -- needed
      # by "Tagged commit is on main" below, and now also by the native-gate decision
      # step, which compares this tag against the previous release tag. No separate
      # `fetch-tags: true` is needed on top of it, and there is no cheaper option that
      # would still see every tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Resolve the version this tag declares
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME is missing the v prefix; the tag format is v<major>.<minor>.<patch>"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $GITHUB_REF_NAME does not name a semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tag $GITHUB_REF_NAME declares version $version"

      # Catches: a tag that disagrees with the version the app will actually report.
      - name: Tag agrees with app.json
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          declared=$(node -p "require('./app.json').expo.version")
          echo "app.json expo.version = $declared"
          if [ "$declared" != "$EXPECTED" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with app.json expo.version ($declared)"
            exit 1
          fi

      # Catches: the second version field drifting. app.json is the source; this
      # only proves the copy still matches it.
      - name: package.json agrees with app.json
        run: |
          set -euo pipefail
          app=$(node -p "require('./app.json').expo.version")
          pkg=$(node -p "require('./package.json').version")
          echo "package.json version = $pkg"
          if [ "$pkg" != "$app" ]; then
            echo "::error::package.json version ($pkg) disagrees with app.json expo.version ($app)"
            exit 1
          fi

      # Catches: a release published with empty notes.
      - name: CHANGELOG carries a non-empty section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Exact prefix match, not a regex: a version is full of dots, and every
          # attempt to escape them through awk -v silently matched nothing.
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty ## [$VERSION] section; promote ## [Unreleased] before tagging"
            exit 1
          fi
          echo "--- release notes ---"
          cat release-notes.md

      # Catches: a release cut from unmerged dev. main carries deployments.
      - name: Tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of main; merge dev into main and tag the merge commit"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # --ignore-scripts is the belt to CI=true's braces. GitHub Actions exports
      # CI=true, which is what makes lefthook's postinstall skip installing hooks;
      # the flag stops every lifecycle script regardless of that variable, so this
      # runner cannot rewrite hooks even if the guard env var ever goes missing.
      # Nothing here needs one to run: package.json deliberately has no `prepare`
      # script and `trustedDependencies` lists only lefthook. See ARCHITECTURE.md
      # "Hook installation is host-owned".
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Catches: a tag cut from a commit whose pre-commit hook failed OPEN. A
      # clobbered lefthook hook exits 0 while running nothing, so the local gate
      # cannot be trusted to have run. `lint` is deliberately absent: it is
      # enforced per staged file, and `eslint .` repo-wide still carries standing
      # debt that has nothing to do with this release.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # C2: decides whether the `native` job (Kotlin unit tests + Android lint) needs
      # to run at all. Compares this tag's commit against the previous release tag --
      # see scripts/lib/release-native-gate.mjs for the exact watched-path list and
      # scripts/release-native-gate.mjs for the git plumbing. FAIL SAFE BY
      # CONSTRUCTION: any git failure, missing previous tag, or doubt at all makes it
      # report `run`, never `skip` -- only a definitive "no watched path changed"
      # skips the gate. The `native` job's own `if:` (see below) reads this output;
      # a `skip` here shows the whole job as visibly SKIPPED, not a green, empty one.
      - name: Decide whether the native gate needs to run
        id: native-gate
        run: node ./scripts/release-native-gate.mjs

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  # C7: the native gate, split out of `guard` so it runs in PARALLEL with `build`
  # instead of serialized in front of it (~8 minutes of wall clock the release no
  # longer waits on end-to-end, since the release build takes far longer than this
  # job either way). A broken JUnit/lint run still blocks the release: `publish`
  # requires this job to have either succeeded or been skipped by the C2 decision
  # above, never to have failed (see `publish`'s `if:` condition for exactly how).
  #
  # FAIL CLOSED, not `== 'run'`: this reads `!= 'skip'`, so only an EXPLICIT `skip`
  # from the C2 decision skips this job -- an empty, missing, or otherwise unexpected
  # `native` output (a step bug, a renamed output, guard.outputs.native never being
  # set) runs the gate instead of silently skipping it. `!= 'skip'` still carries an
  # IMPLICIT `&& success()`: GitHub Actions only adds that implicit check when the
  # condition does NOT already call one of success()/failure()/cancelled()/always()
  # itself. So this line means "guard succeeded AND its C2 decision was not an
  # explicit skip" without spelling out the first half -- if `guard` fails for any
  # other reason, this job is skipped exactly like `build` is, by the same implicit
  # rule.
  native:
    name: Native gate (Kotlin unit tests + Android lint)
    needs: guard
    if: needs.guard.outputs.native != 'skip'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Catches: the Kotlin unit-test harness (JUnit 4 + Robolectric, `modules/sync-engine` and
      # `modules/foreground-sync-ticker`) regressing silently, and an Android lint regression in
      # those same two modules -- the only ones this repo owns a native Gradle project for. It
      # only exists in a host-generated `android/` project (never committed), so `bun run
      # test:kotlin` prebuilds one here on the runner -- the same command lefthook's `native`
      # pre-commit job runs locally (lefthook.yml, tests only, no lint there), so there is exactly
      # one place that decides what the Kotlin gate runs. Gradle 9.0.0 / AGP 8.12.0 (as generated
      # by this project's prebuild) need JDK 17 at minimum; 17 is also what `build` already uses
      # to run this exact toolchain's full production build, so it is proven sufficient, not
      # merely the floor.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      # Gradle distribution + dependency caching (C1). `cache-provider` defaults to `enhanced`, a
      # commercial caching service this repo has no account for -- `basic` uses the open-source
      # GitHub Actions cache instead, which is free for a public repo. `cache-read-only` defaults
      # to `true` for any ref that is not the default branch (verified in `setup-gradle/action.yml`
      # at this pin); a release only ever runs on a pushed tag, which is never the default branch,
      # so the default would silently write nothing back, ever. Tags are created only by the
      # maintainer (see .claude/skills/mobile-release/SKILL.md "Agent Notes"), so writing the cache
      # from every tagged run is safe.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: false

      # C3: lint and tests run in the SAME Gradle invocation (`--with-lint`, handled in
      # scripts/lib/kotlin-tests.mjs's buildGradleTestArgs) -- one configuration phase, one
      # daemon, instead of two separate `./gradlew` calls. `--build-cache` (C1) is also on inside
      # that invocation, unconditionally: see buildGradleTestArgs' own comment for why it is safe
      # here and never applied to the release build.
      - name: Kotlin unit tests + Android lint (sync-engine, foreground-sync-ticker)
        run: bun run test:kotlin -- --with-lint

  # `build` and `native` both depend only on `guard` and run in PARALLEL (C7). No
  # `contents: write` here -- only `publish` needs it, and the workflow default
  # (`permissions: contents: read` above) already covers everything this job does.
  build:
    name: Build the release APK
    needs: guard
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      APK: autoreas-mobile-${{ needs.guard.outputs.version }}-android.apk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      # Same distribution + dependency caching as the native job (C1) -- see its comment for
      # `cache-provider`/`cache-read-only`. The Gradle BUILD cache (task-output reuse) is
      # deliberately NOT enabled here: reusing a cached task output inside the artifact that
      # actually ships is a separate decision from caching downloads/config, and it has not been
      # measured yet (see docs/logbooks/build-performance.md "Pending measurement"). Revisit once
      # v1.6.1 shows whether distribution+dependency caching alone (this step) is enough on its own.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The same command the local Docker path runs, on a host that needs none of
      # Docker Desktop's workarounds -- pinned here, where the container still
      # floats on @latest. 23.2.0 is the exact version that built and published
      # v1.0.0: it was published 2026-08-31 and is still the newest on npm, so the
      # @latest that ran then resolved to it. Signing keys are not in this repo:
      # credentialsSource defaults to remote, so EAS hands the keystore down over
      # its API and EXPO_TOKEN is the only secret this needs.
      - name: Build the release APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          bunx eas-cli@23.2.0 build \
            --local \
            --platform android \
            --profile production \
            --non-interactive \
            --output "$APK"

      - name: Locate aapt2
        id: aapt2
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt2=$(find "$sdk/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$aapt2" ]; then
            echo "::error::no aapt2 under $sdk/build-tools; the artifact guards cannot run"
            exit 1
          fi
          echo "path=$aapt2" >> "$GITHUB_OUTPUT"
          echo "using $aapt2"

      # Catches: eas.json losing android.buildType, which silently swaps the APK
      # for an AAB. Nobody can sideload an AAB from a GitHub release, and the
      # build stays green all the way through.
      - name: Artifact is an APK, not an app bundle
        env:
          AAPT2: ${{ steps.aapt2.outputs.path }}
        run: |
          set -euo pipefail
          if unzip -l "$APK" | grep -q 'BundleConfig.pb'; then
            echo "::error::$APK is an Android App Bundle, not an APK; restore android.buildType=apk in eas.json"
            exit 1
          fi
          "$AAPT2" dump badging "$APK" > badging.txt
          echo "artifact verified as an installable APK"

      # Catches: a build whose versionName does not match the tag. appVersionSource
      # is remote, so nothing bumps expo.version for you and a stale prebuild would
      # ship the previous name without failing anything.
      - name: APK reports the tagged version
        run: |
          set -euo pipefail
          name=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt | head -1)
          code=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" badging.txt | head -1)
          echo "APK versionName=$name versionCode=$code"
          if [ "$name" != "$VERSION" ]; then
            echo "::error::APK versionName ($name) does not match the tag ($VERSION)"
            exit 1
          fi

      # Catches: withAndroidForegroundSync silently no longer applying. It is the
      # only source of android:foregroundServiceType, the tick-alarm receiver, the
      # native SyncForegroundService declaration, and the battery-optimization-exemption
      # permission, and Android 14+ refuses to start a service without the type —
      # background sync would die on device while every test and the build stay green.
      # The receiver and the two extra permissions were added for the multi-day-survival
      # fix (background-service-multiday-survival); SyncForegroundService was added for
      # native-foreground-sync-service T3; this guard was widened alongside each so a
      # silently-unapplied plugin cannot ship again.
      - name: Foreground sync survived the prebuild
        env:
          AAPT2: ${{ steps.aapt2.outputs.path }}
        run: |
          set -euo pipefail
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          for needle in \
            app.notifee.core.ForegroundService \
            foregroundServiceType \
            expo.modules.foregroundsyncticker.TickAlarmReceiver \
            expo.modules.syncengine.SyncForegroundService; do
            if ! grep -q "$needle" manifest.txt; then
              echo "::error::the shipped manifest is missing $needle; plugins/withAndroidForegroundSync.js did not apply"
              exit 1
            fi
          done
          for permission in \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_DATA_SYNC \
            android.permission.FOREGROUND_SERVICE_SPECIAL_USE \
            android.permission.POST_NOTIFICATIONS \
            android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS \
            android.permission.WAKE_LOCK; do
            if ! grep -q "$permission" badging.txt; then
              echo "::error::the shipped APK is missing $permission"
              exit 1
            fi
          done
          echo "foreground service, its data-sync type, the tick-alarm receiver and all six permissions are present"

      # Catches: a shipped APK that reports itself debuggable. `android:debuggable` widens the
      # attack surface and is the exact attribute `withAndroidLabDebuggable` adds for lab builds,
      # so this guard fails the release if that plugin ever leaks past the lab profile gate.
      - name: APK is not debuggable
        env:
          AAPT2: ${{ steps.aapt2.outputs.path }}
        run: |
          set -euo pipefail
          if "$AAPT2" dump badging "$APK" | grep -q 'application-debuggable'; then
            echo "::error::$APK reports itself debuggable; a release APK must never be debuggable"
            exit 1
          fi
          echo "artifact verified as non-debuggable"

      - name: Checksum
        run: |
          set -euo pipefail
          sha256sum "$APK" > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt

      # Hands the built, checked artifact to `publish` (C7): `build` itself never holds
      # `contents: write`, so it cannot publish anything even if a later step here were
      # compromised. Short retention: this is an intra-workflow handoff, not the release
      # asset itself -- the real, permanent copy is what `publish` attaches to the GitHub
      # Release below.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-apk
          path: |
            ${{ env.APK }}
            SHA256SUMS-android.txt
          retention-days: 1

  # C7: the only job with `contents: write`. Needs `guard` directly (not just
  # transitively through `build`/`native`) so it can read `needs.guard.outputs.version`
  # for the APK filename below -- GitHub Actions only exposes a job's outputs to jobs
  # that list it in their OWN `needs:`, not to transitive dependents.
  #
  # The `if:` explicitly names `!cancelled()` to turn OFF the implicit `&& success()`
  # every other job on this page relies on (see `native`'s comment): without it, GitHub
  # would refuse to run this job at all whenever `native` was skipped by the C2
  # decision, since "skipped" is not "succeeded". The condition it replaces that
  # default with: publish when `build` succeeded AND (`native` succeeded, OR `native`
  # was skipped AND that skip was the EXPLICIT C2 decision, read straight from
  # `guard`'s own output rather than trusted from `native`'s result alone) -- never
  # when `native` failed, and never when this job itself was cancelled.
  #
  # FAIL CLOSED: the extra `needs.guard.outputs.native == 'skip'` check means a
  # `native` result of `'skipped'` is only ever treated as safe when `guard` itself
  # explicitly said `skip` -- never inferred from the mere fact that it was skipped.
  # This matters because "skipped" alone does not say WHY: a `native` skipped for any
  # OTHER reason (e.g. `guard` failing, which skips `native` via the implicit
  # `success()` check on its `if:`) must not reach here either. In practice that other
  # case is already blocked one level up too -- `build` also only runs on `guard`'s
  # implicit success, so a failed `guard` already makes `build` skip, which alone
  # fails this condition -- but the explicit decision check makes this job's own
  # safety independent of that coincidence, not reliant on it.
  publish:
    name: Publish the release
    needs: [guard, build, native]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.native.result == 'success' || (needs.native.result == 'skipped' && needs.guard.outputs.native == 'skip')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APK: autoreas-mobile-${{ needs.guard.outputs.version }}-android.apk
    steps:
      # No checkout: this job publishes two already-built artifacts and needs no
      # repository source. `gh` is told which repo to target explicitly
      # (`--repo "$GITHUB_REPOSITORY"` below) instead of relying on a checked-out
      # git remote to infer it.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "$APK" \
            SHA256SUMS-android.txt
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,assets
