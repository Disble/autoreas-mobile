services:
  eas-build:
    build:
      context: .
      dockerfile: Dockerfile.eas

    # Use host network — container shares Windows/WSL2 network stack directly.
    # This fixes all DNS issues without any extra config or IP pinning.
    network_mode: host

    volumes:
      # Mount project into container
      - .:/app

      # Isolate node_modules inside container (Linux binaries, not Windows)
      # This volume persists — Bun install is fast on subsequent runs
      - node_modules:/app/node_modules

      # Cache Gradle downloads and build outputs (~1-2GB, only downloaded once)
      - gradle_cache:/root/.gradle

      # Docker-only Gradle speed-ups, layered over the cache volume (see the files for why):
      # the build cache switch and an init script that skips lintVital. Read-only; CI never
      # mounts them, so release builds are unaffected.
      - ./docker/gradle/gradle.properties:/root/.gradle/gradle.properties:ro
      - ./docker/gradle/init.d:/root/.gradle/init.d:ro

      # Cache Android SDK extras (avoids re-downloading NDK components)
      - android_cache:/root/.android

      # Cache Bun package downloads and Bunx CLI resolution
      - bun_cache:/root/.bun/install/cache

    # Fix Java/Gradle DNS on Docker Desktop Windows:
    # Java tries IPv6 first by default — IPv6 is broken in Docker Desktop on Windows.
    # This forces Java to use IPv4, fixing all Gradle/SDK download DNS failures.
    environment:
      # Stops this Linux container from rewriting the HOST's Git hooks.
      #
      # `- .:/app` below bind-mounts the whole project, and a bind mount includes `.git`
      # no matter what `.dockerignore` says -- `.dockerignore` only filters the `docker build`
      # context, never a runtime mount. So `bun install` here runs lefthook's postinstall
      # against the real `.git/hooks/` on Windows and regenerates every hook with Linux
      # binary paths (`/tmp/root/eas-build-local-nodejs/.../lefthook-linux-x64/bin/lefthook`).
      # The hooks then survive only via lefthook's fallback chain, and its last branch echoes
      # a message and EXITS 0 -- a silently passing gate.
      #
      # `CI=true` is lefthook's documented off switch for that postinstall. It is read by
      # `node_modules/lefthook/postinstall.js`, NOT by the `lefthook install` command, so it
      # only works while package.json has no explicit `prepare: lefthook install` (that
      # script bypassed this guard and was removed for exactly this reason).
      #
      # package.json's `trustedDependencies: ["lefthook"]` is the other half: Bun blocks
      # dependency lifecycle scripts by default, so without it the postinstall never runs on
      # ANY machine and nobody gets hooks. Verified on Bun 1.3.14 -- `bun install` installs
      # hooks, `CI=true bun install` does not. See ARCHITECTURE.md "Hook installation is
      # host-owned".
      - CI=true
      # The persistent Gradle volume and the files mounted over it live in /root/.gradle. The base
      # image sets GRADLE_USER_HOME to /opt/gradle-home, which silently bypassed all three (cache,
      # build-cache switch, lintVital init script). Pin it here; the entrypoint refuses to build
      # when Gradle would not see that configuration.
      - GRADLE_USER_HOME=/root/.gradle
      # AUTOREAS_ANDROID_ABIS itself is deliberately NOT set here. It reaches the container two
      # other ways instead -- via `env_file: .env.local` below (a developer's persistent
      # override) or `docker compose run -e AUTOREAS_ANDROID_ABIS=...` (Compose's own `run -e`
      # already beats `env_file:` for that key, no help needed) -- and the entrypoint script
      # resolves the final value, validates it, and prints where it came from. See
      # docs/local-android-build.md ("Configuration reference") for the full precedence and
      # docker/eas-build-entrypoint.sh for why: Compose interpolates `${VAR}` in THIS file from
      # the HOST shell at parse time, never from `.env.local`, so a naive
      # `${AUTOREAS_ANDROID_ABIS:-arm64-v8a}` here silently ignored .env.local entirely.
      #
      # This line only captures a bare shell export (no `-e`) for the entrypoint, under a
      # DIFFERENT name than AUTOREAS_ANDROID_ABIS on purpose -- a same-named `environment:` entry
      # always wins over `env_file:` for that key even when the host variable is unset (verified
      # empirically against Docker Compose v2.40.3-desktop.1), which would silently empty out
      # whatever .env.local set.
      - AUTOREAS_ANDROID_ABIS_SHELL_OVERRIDE=${AUTOREAS_ANDROID_ABIS:-}
      # expo-doctor exits 1 on this project and EAS ignores it anyway; skipping saves ~6 s.
      - EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP=1
      # Select files from .easignore without Git. Required from a Git worktree, where `.git` is a
      # file pointing at a Windows path the container cannot resolve.
      - EAS_NO_VCS=1
      - _JAVA_OPTIONS=-Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3

    # Load all env vars from .env.local (Supabase keys, Firebase paths, EXPO_TOKEN, etc.)
    env_file:
      - .env.local

    # Default profile is "preview" — override by passing arg:
    #   docker compose ... run --rm eas-build production
    #
    # The entrypoint itself lives in docker/eas-build-entrypoint.sh (bind-mounted in via
    # `- .:/app`, same as every other project file). It resolves and validates
    # AUTOREAS_ANDROID_ABIS, then keeps every behaviour this used to inline here: dependency
    # install, the profile argument (defaulting to "preview"), three build attempts with a
    # non-zero exit and "Build FAILED after 3 attempts" if all three fail, and the final success
    # line. Invoked through `bash` explicitly rather than relying on the file's own execute bit,
    # which a Windows bind mount does not reliably preserve.
    entrypoint: ["bash", "docker/eas-build-entrypoint.sh"]
    command: preview

volumes:
  # node_modules: auto-named per project (e.g. nwt-servicehub_node_modules)
  # Docker Compose prefixes with folder name automatically — no conflicts across projects
  node_modules:

  # Gradle/Android/Bun caches are shared across all projects (saves re-downloading)
  gradle_cache:
    name: eas_gradle_cache
  android_cache:
    name: eas_android_cache
  bun_cache:
    name: eas_bun_cache
