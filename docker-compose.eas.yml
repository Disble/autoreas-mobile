services:
  eas-build:
    build:
      context: .
      dockerfile: Dockerfile.eas

    # Use host network — container shares Windows/WSL2 network stack directly.
    # This fixes all DNS issues without any extra config or IP pinning.
    network_mode: host

    volumes:
      # Mount project into container
      - .:/app

      # Isolate node_modules inside container (Linux binaries, not Windows)
      # This volume persists — Bun install is fast on subsequent runs
      - node_modules:/app/node_modules

      # Cache Gradle downloads and build outputs (~1-2GB, only downloaded once)
      - gradle_cache:/root/.gradle

      # Cache Android SDK extras (avoids re-downloading NDK components)
      - android_cache:/root/.android

      # Cache Bun package downloads and Bunx CLI resolution
      - bun_cache:/root/.bun/install/cache

    # Fix Java/Gradle DNS on Docker Desktop Windows:
    # Java tries IPv6 first by default — IPv6 is broken in Docker Desktop on Windows.
    # This forces Java to use IPv4, fixing all Gradle/SDK download DNS failures.
    environment:
      # Stops this Linux container from rewriting the HOST's Git hooks.
      #
      # `- .:/app` below bind-mounts the whole project, and a bind mount includes `.git`
      # no matter what `.dockerignore` says -- `.dockerignore` only filters the `docker build`
      # context, never a runtime mount. So `bun install` here runs lefthook's postinstall
      # against the real `.git/hooks/` on Windows and regenerates every hook with Linux
      # binary paths (`/tmp/root/eas-build-local-nodejs/.../lefthook-linux-x64/bin/lefthook`).
      # The hooks then survive only via lefthook's fallback chain, and its last branch echoes
      # a message and EXITS 0 -- a silently passing gate.
      #
      # `CI=true` is lefthook's documented off switch for that postinstall. It is read by
      # `node_modules/lefthook/postinstall.js`, NOT by the `lefthook install` command, so it
      # only works while package.json has no explicit `prepare: lefthook install` (that
      # script bypassed this guard and was removed for exactly this reason).
      #
      # package.json's `trustedDependencies: ["lefthook"]` is the other half: Bun blocks
      # dependency lifecycle scripts by default, so without it the postinstall never runs on
      # ANY machine and nobody gets hooks. Verified on Bun 1.3.14 -- `bun install` installs
      # hooks, `CI=true bun install` does not. See ARCHITECTURE.md "Hook installation is
      # host-owned".
      - CI=true
      - _JAVA_OPTIONS=-Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3

    # Load all env vars from .env.local (Supabase keys, Firebase paths, EXPO_TOKEN, etc.)
    env_file:
      - .env.local

    # Default profile is "preview" — override by passing arg:
    #   docker compose ... run --rm eas-build production
    entrypoint: >
      bash -c "
        echo '--- Installing dependencies ---' &&
        bun install --frozen-lockfile &&
        echo '--- Starting EAS local build ---' &&
        for attempt in 1 2 3; do
          bunx eas-cli@latest build --local --platform android --profile $${0:-preview} --non-interactive && break
          echo \"--- Attempt $$attempt failed, retrying in 5s... ---\" &&
          sleep 5
        done &&
        echo '--- Build complete. APK is in your project folder. ---'
      "
    command: preview

volumes:
  # node_modules: auto-named per project (e.g. nwt-servicehub_node_modules)
  # Docker Compose prefixes with folder name automatically — no conflicts across projects
  node_modules:

  # Gradle/Android/Bun caches are shared across all projects (saves re-downloading)
  gradle_cache:
    name: eas_gradle_cache
  android_cache:
    name: eas_android_cache
  bun_cache:
    name: eas_bun_cache
