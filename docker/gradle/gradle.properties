# Gradle user-home properties for the local Docker APK build ONLY.
#
# docker-compose.eas.yml mounts this file at /root/.gradle/gradle.properties, on top of the
# persistent `eas_gradle_cache` volume. CI (release.yml) runs `eas build --local` on the runner,
# never this container, so nothing here changes a release build.
#
# EAS extracts the project into a fresh working directory on every build, so Gradle's incremental
# state never survives from one build to the next (the baseline showed "1108 actionable tasks:
# 1108 executed"). The build cache lives in the persistent user home instead and lets cacheable
# tasks (Kotlin/Java compilation, dexing, resource merging) be reused across builds.
org.gradle.caching=true
